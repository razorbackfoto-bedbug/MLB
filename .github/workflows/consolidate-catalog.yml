name: Consolidate catalog

on:
  push:
    paths:
      - 'scripts/consolidate-catalog.mjs'
      - '.github/workflows/consolidate-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consolidate JSON catalog
        run: node scripts/consolidate-catalog.mjs
      - name: Commit consolidated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/books.json src/data/curatedAdditions.json src/data/loeysDietzAdditions.json src/data/coverOverrides.ts || true
          if ! git diff --cached --quiet; then
            git commit -m "Consolidate book catalog into books.json"
            git push
          fi
